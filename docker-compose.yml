name: airis-mcp-gateway

services:
  # Ollama for embeddings (used by mindbase for semantic search)
  # Model is pulled on first startup via init container
  ollama:
    container_name: airis-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Pull embedding model on first startup
  ollama-init:
    container_name: airis-ollama-init
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags >/dev/null 2>&1; do
          echo "Waiting..."
          sleep 2
        done
        echo "Pulling nomic-embed-text model..."
        curl -X POST http://ollama:11434/api/pull -d '{"name": "nomic-embed-text"}'
        echo ""
        echo "Model ready!"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # PostgreSQL for mindbase (with pgvector extension)
  # Required by mindbase MCP server for memory/graph storage
  mindbase-postgres-dev:
    container_name: mindbase-postgres-dev
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=mindbase
      - POSTGRES_PASSWORD=mindbase
      - POSTGRES_DB=mindbase
    volumes:
      - mindbase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbase -d mindbase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Note: mindbase is now managed by Docker MCP Gateway via airis-catalog.yaml
  # The gateway handles stdio-to-SSE conversion automatically

  # Serena MCP Server (internal, port 8000)
  # Semantic code retrieval and editing capabilities
  # Only started with: docker compose --profile serena-remote up -d
  serena:
    container_name: airis-serena
    profiles: ["serena-remote"]
    image: ghcr.io/oraios/serena:latest
    command:
      - serena
      - start-mcp-server
      - --transport
      - sse
      - --port
      - "8000"
      - --context
      - ide-assistant
    expose:
      - "8000"
    volumes:
      - ${HOST_WORKSPACE_DIR:-${HOME}/github}:/workspaces/projects:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health 2>/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Docker MCP Gateway (internal, port 9390)
  # Manages MCP servers from Docker catalog
  gateway:
    container_name: airis-mcp-gateway-core
    image: docker/mcp-gateway:latest
    command:
      - --transport=sse
      - --port=9390
      - --watch
      - --additional-catalog=/catalogs/airis-catalog.yaml
      - --servers=time,mindbase
    expose:
      - "9390"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_WORKSPACE_DIR:-${HOME}/github}:/workspace:rw
      - ./catalogs:/catalogs:ro
    depends_on:
      ollama:
        condition: service_healthy
      mindbase-postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qS --spider http://localhost:9390/health 2>&1 | grep -q '200'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Proxy (external, port 9400)
  # Hybrid MCP Multiplexer: Docker Gateway + Process (uvx/npx)
  api:
    container_name: airis-mcp-gateway
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "9400:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - MCP_GATEWAY_URL=http://gateway:9390
      - MCP_CONFIG_PATH=/app/mcp-config.json
      - GATEWAY_CONFIG_PATH=/app/config/gateway-config.yaml
      - SERENA_MODE=${SERENA_MODE:-serena-local}
    volumes:
      - ./mcp-config.json:/app/mcp-config.json:ro
      - ./config/gateway-config.yaml:/app/config/gateway-config.yaml:ro
      - ./profiles:/app/profiles:rw
      # Persistent data volumes
      - cache-uv:/root/.cache/uv        # uvx package cache (faster restarts)
      - cache-npm:/root/.npm            # npm package cache (faster restarts)
      - memory-data:/app/data           # Knowledge graph persistence
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ollama-data:        # Ollama models cache (nomic-embed-text ~274MB)
  mindbase-data:      # PostgreSQL data for pgvector
  mindbase-memories:  # Mindbase markdown files (persists across container restarts)
  cache-uv:           # uvx package cache (persists airis-agent packages)
  cache-npm:          # npm package cache (persists npx server packages)
  memory-data:        # Knowledge graph JSON file
